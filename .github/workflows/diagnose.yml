name: YT API diagnostics

on:
  workflow_dispatch:
  # Nightly, so a YouTube player-client rotation or cipher change shows up
  # here before users hit it. GitHub emails the repo owner when a scheduled
  # run on the default branch fails.
  schedule:
    - cron: '0 6 * * *'

jobs:
  diagnose:
    name: E2E test against real YouTube Music API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.2'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Run diagnostics
        run: flutter test test/yt_e2e_diagnose_test.dart -r expanded

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: NewPipe resolver JVM test (real network)
        run: |
          # Materializes android/gradlew + local.properties without building
          # (system gradle is v9 and cannot load Flutter 3.24's plugin)
          flutter build apk --config-only
          cd android
          ./gradlew :app:testReleaseUnitTest --tests "com.anandnet.harmonymusic.NewPipeResolverTest"
