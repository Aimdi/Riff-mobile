name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Also create a GitHub release with this tag (e.g. v1.0.0)'
        required: false
        default: ''
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Analyze and build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.7'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APKs (universal + per-abi)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/

      # Same app minus the bundled mpv video engine (video mode hides
      # itself at runtime) — for users who want the small audio-only APK.
      - name: Build lite APKs (audio-only, no video engine)
        env:
          ORG_GRADLE_PROJECT_audioOnlyLite: 'true'
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          for f in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$f" .apk)
            cp "$f" "dist/${base%-release}-lite-release.apk"
          done
          ls -la dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: riff-apks
          path: dist/*.apk

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
